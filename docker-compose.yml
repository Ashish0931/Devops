name: "my-app"
services:
  voting_appt:
    image: dockersamples/examplevotingapp_vote
    ports:
      - "5000:80"
    deploy:
      mode: replicated
      replicas: 4
    networks:
      - frontend
  redis:
    image: redis:alpine
    deploy:
      mode: replicated
      replicas: 4
    networks:
      - frontend
  worker:
    image: dockersamples/examplevotingapp_worker
    deploy:
      mode: replicated
      replicas: 4
    networks:
      - frontend
      - backend
  db_service:
    image: postgres:15-alpine
    volumes:
      - "db_service:/var/lib/postgresql/data"
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1
  result_service:
    image: dockersamples/examplevotingapp_result
    ports:
      - "5001:80"
    networks:
      - backend
    deploy:
      mode: replicated
      replicas: 1

networks:
  frontend:
  backend:
volumes:
  db_service:
